<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Birthday Celebration</title>

<style>
.save-section{
    margin-top:40px;
    padding-top:20px;
    border-top:2px solid rgba(255,255,255,.4);
}

.save-section h3{
    color:white;
}
body{
    margin:0;
    padding:20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

h1{
    color:white;
}

input,textarea,select{
    padding:10px;
    margin:8px;
    border-radius:8px;
    border:none;
}

textarea{
    width:90%;
    max-width:700px;
}

button{
    padding:12px 20px;
    background:#ff4081;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#e91e63;
}

#heroImage{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:50%;
    border:8px solid gold;
    display:none;
    margin:20px auto;
}

 #cake{
    width:600px;
    max-width:95%;
    min-height:250px;
    margin:80px auto 20px auto;
    background:#ff69b4;
    border-radius:20px 20px 80px 80px;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

#cakeTop{
    height:35px;
    background:white;
    border-radius:50%;
}

#cakeMessage{
    padding:20px;
    font-size:20px;
}

.slideshow{
    width:700px;
    max-width:95%;
    height:400px;
    margin:auto;
    overflow:hidden;
    border-radius:15px;
    background:white;
}

.slideshow img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#videoGallery{
    margin-top:30px;
}

#videoGallery iframe{
    width:90%;
    max-width:700px;
    height:400px;
    display:block;
    margin:15px auto;
    border:none;
    border-radius:15px;
}

.cake-fall{
    position: fixed;
    top: -40px;
    pointer-events: none;
    z-index: 9999;
    font-size: 22px; /* smaller cakes */
    will-change: transform;
}

@keyframes fallCake {
    0% {
        transform: translateY(-40px) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.9;
    }
}

@media(max-width:700px){

.slideshow{
    height:250px;
}

#heroImage{
    width:150px;
    height:150px;
}

}
#cake{
    position:relative;
}

#candles{
    position:absolute;
    top:-40px;
    left:0;
    width:100%;
    height:50px;
    z-index:10;
}

.candle{
    position:absolute;
    width:10px;
    height:35px;
    background:repeating-linear-gradient(
        45deg,
        #ff6b6b,
        #ff6b6b 4px,
        white 4px,
        white 8px
    );
    transform:translateX(-50%);
    border-radius:4px;
}

.flame{
    position:absolute;
    width:12px;
    height:18px;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    background:gold;
    border-radius:50% 50% 50% 50%;
    box-shadow:
        0 0 8px orange,
        0 0 15px yellow,
        0 0 25px orange;
    animation:flicker .25s infinite alternate;
}

@keyframes flicker{
    0%{
        transform:translateX(-50%) rotate(-4deg) scale(0.9);
    }
    100%{
        transform:translateX(-50%) rotate(4deg) scale(1.1);
    }
}
#partyCameraBtn{
    position:fixed;
    bottom:20px;
    right:20px;
    width:70px;
    height:70px;
    border-radius:50%;
    font-size:28px;
    z-index:9999;
    background:#ff4081;
    color:white;
    border:none;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.confetti{
    position:fixed;
    pointer-events:none;
    z-index:9999;

}

@keyframes confettiFall{
    0%{
        transform:translateY(-20px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(1080deg);
        opacity:0;
    }
}
#countdownOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10000;
}

#countdownNumber{
    color:white;
    font-size:min(8rem,20vw);
    font-weight:bold;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<div id="countdownOverlay" style="display:none;">
    <div id="countdownNumber">3</div>
</div>

<h1>🎂 Happy Birthday Celebration 🎂</h1>

<input type="text" id="nameInput" placeholder="Child Name">

<input type="number"
       id="ageInput"
       placeholder="Age"
       min="1"
       max="78">

<textarea id="birthdayText"
          placeholder="Birthday message"></textarea>


<br>

<select id="voiceSelect"></select>

<button onclick="readMessage()">
🔊 Read Message
</button>

<button onclick="stopReading()">
⏹ Stop
</button>

<br><br>

<h3>🦸 Birthday Person Photo</h3>

<input
type="file"
id="heroInput"
accept="image/*">

<br>

<h3>🎵 Birthday Song</h3>

<select id="songSelect">
    <option value="">Choose a Song</option>

<option value="https://raw.githubusercontent.com/firetvvv03-master/bdmusic/main/saavane-happy-birthday-254480.mp3">
    Happy Birthday - Saavane
</option>


    <option value="upload">
        🎵 Use My Own Song
    </option>
</select>

<br><br>

<div id="customMusicArea" style="display:none;">
    <input
        type="file"
        id="musicInput"
        accept="audio/*">

    <br><br>

    <input
        type="text"
        id="customSongUrl"
        placeholder="Or paste MP3 URL"
        style="width:300px;">
</div>

<br>

<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    style="display:none;">
<h3>🖼️ Upload Photos (Max 100)</h3>


<button onclick="takePartyPhoto()">
📸 Take Party Photo
</button>

<input
type="file"
id="photoInput"
accept="image/*"
multiple>

<br>

<h3>🎥 Upload Videos (Max 3)</h3>

<h3>🎥 Videos</h3>

<input
type="file"
id="videoInput"
accept="video/*"
multiple>

<br><br>

<button onclick="startCountdown()">
    Start Celebration
</button>

<button onclick="pauseCelebration()">
    Pause Celebration
</button>

<button onclick="stopCelebration()">
    Stop Celebration
</button>

<button onclick="clearAll()">
    🗑️ Clear All
</button>

<br><br>

<img id="heroImage">

<div id="cake">
    <div id="candles"></div>

    <div id="cakeTop"></div>

    <div id="cakeMessage">
        Your birthday message appears here.
    </div>
</div>
<button onclick="blowCandles()">
    💨 Blow Out Candles
</button>
<div class="slideshow">
<img id="slideImage">
</div>


<h2>🎥 Birthday Videos</h2>

<div id="videoGallery"></div>

<audio id="audioPlayer" controls></audio>

<script>
let voices=[];
let photos=[];
let currentPhoto=0;
let slideshowTimer;
let isPaused = false;

function loadVoices(){

    voices=speechSynthesis.getVoices();

    const select=
    document.getElementById(
    "voiceSelect"
    );

    select.innerHTML="";

    voices.forEach((voice,index)=>{

        const option=
        document.createElement(
        "option"
        );

        option.value=index;

        option.text=
        voice.name+" ("+
        voice.lang+")";

        select.appendChild(option);
    });
}

speechSynthesis.onvoiceschanged=
loadVoices;

loadVoices();

function readMessage(){

    const text=
    document.getElementById(
    "birthdayText"
    ).value;

    if(text==="") return;

    speechSynthesis.cancel();

    const speech=
    new SpeechSynthesisUtterance(
    text
    );

    speech.voice=
    voices[
    document.getElementById(
    "voiceSelect"
    ).value
    ];

    speechSynthesis.speak(
    speech
    );
}
function takePartyPhoto() {
    document.getElementById("cameraInput").click();
}
function stopReading(){

    speechSynthesis.cancel();
}
document
.getElementById("songSelect")
.addEventListener("change", function(){

    const area =
    document.getElementById(
        "customMusicArea"
    );

    area.style.display =
        this.value === "upload"
        ? "block"
        : "none";
});
function launchConfetti() {

    for(let i = 0; i < 200; i++) {

        const piece =
            document.createElement("div");

        piece.className = "confetti";

        const colors = [
            "#ff4081",
            "#ffeb3b",
            "#4caf50",
            "#2196f3",
            "#ff9800",
            "#9c27b0"
        ];

        piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        const size =
            3 + Math.random() * 4;

        piece.style.width =
            size + "px";

        piece.style.height =
            size + "px";

        piece.style.borderRadius =
            "50%";

        /* Start in center */
        piece.style.left = "50vw";
        piece.style.top = "40vh";

        document.body.appendChild(piece);

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            550 + Math.random() * 500;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        piece.animate(
            [
                {
                    transform:
                        "translate(0,0) scale(1)",
                    opacity: 1
                },
                {
                    transform:
                        `translate(${x}px, ${y}px)
                         rotate(720deg)`,
                    opacity: 0
                }
            ],
            {
                duration: 7500,
                easing: "cubic-bezier(.1,.8,.2,1)",
                fill: "forwards"
            }
        );

        setTimeout(() => {
            piece.remove();
        }, 7500);
    }
}
function startCountdown() {

    const overlay =
        document.getElementById("countdownOverlay");

    const number =
        document.getElementById("countdownNumber");

    const items = [
        "3",
        "2",
        "1",
        "🎉 HAPPY BIRTHDAY! 🎉"
    ];

    let index = 0;

    overlay.style.display = "flex";
overlay.style.flexDirection = "column";
    number.textContent = items[0];

    const timer = setInterval(() => {

        index++;

        if(index < items.length){

            number.textContent = items[index];

        }else{

            clearInterval(timer);

            setTimeout(() => {

                overlay.style.display = "none";

                startCelebration();

            }, 1500);

        }

    },1000);
}
function startCelebration() {

    if(isPaused){

        const player =
            document.getElementById("audioPlayer");

        player.play();

        slideshowTimer =
            setInterval(nextPhoto,3000);

        startCakeRain();

        isPaused = false;

        return;
    }

    let name =
        document.getElementById("nameInput").value;

    if(name===""){
        name="Friend";
    }

    const text =
        document.getElementById("birthdayText").value;

    document.getElementById("cakeMessage").innerHTML =
        "<h2>🎂 Happy Birthday " +
        name +
        " 🎂</h2><br>" +
        text;

    loadHero();
    loadMusic();
    loadPhotos();
    loadVideos();

    startCakeRain();

    launchConfetti();

setTimeout(() => {
    launchConfetti();
}, 5000);

setTimeout(() => {
    launchConfetti();
}, 9000);

setTimeout(() => {
    launchConfetti();
}, 13000);

setTimeout(() => {
    launchConfetti();
}, 16000);
setTimeout(() => {
    launchConfetti();
}, 20000);

setTimeout(() => {
    launchConfetti();
}, 24000);

setTimeout(() => {
    launchConfetti();
}, 28000);

setTimeout(() => {
    launchConfetti();
}, 32000);
    const age =
        parseInt(
            document.getElementById("ageInput").value
        ) || 1;

    createCandles(age);
}
function loadHero(){

    const file=
    document.getElementById(
    "heroInput"
    ).files[0];

    if(!file) return;

    const hero=
    document.getElementById(
    "heroImage"
    );

    hero.src=
    URL.createObjectURL(
    file
    );

    hero.style.display=
    "block";
}

function loadMusic(){

    const player =
    document.getElementById(
        "audioPlayer"
    );

    const selectedSong =
    document.getElementById(
        "songSelect"
    ).value;

    if(selectedSong &&
       selectedSong !== "upload")
    {
        player.src =
        selectedSong;

        player.play();

        return;
    }

    const customUrl =
    document.getElementById(
        "customSongUrl"
    ).value.trim();

    if(customUrl){
        player.src = customUrl;
        player.play();
        return;
    }

    const file =
    document.getElementById(
        "musicInput"
    ).files[0];

    if(!file) return;

    player.src =
    URL.createObjectURL(file);

    player.play();
}

function loadPhotos(){

    const files=
    document.getElementById(
    "photoInput"
    ).files;

    if(files.length===0)
        return;

    if(files.length>100){

        alert(
        "Maximum 100 photos."
        );

        return;
    }

    photos=[];

    for(let i=0;i<files.length;i++){

        photos.push(
        URL.createObjectURL(
        files[i]
        ));
    }

    currentPhoto=0;

    document.getElementById(
    "slideImage"
    ).src=
    photos[0];

    clearInterval(
    slideshowTimer
    );

    slideshowTimer=
    setInterval(
    nextPhoto,
    3000
    );
}

function nextPhoto(){

    currentPhoto++;

    if(
    currentPhoto>=
    photos.length
    ){
        currentPhoto=0;
    }

    document.getElementById(
    "slideImage"
    ).src=
    photos[currentPhoto];
}

function loadVideos() {
    const gallery =
        document.getElementById("videoGallery");

    gallery.innerHTML = "";

    // Local uploaded videos
    const files =
        document.getElementById("videoInput").files;

    for (let i = 0; i < Math.min(files.length, 3); i++) {
        const video = document.createElement("video");
        video.controls = true;
        video.src = URL.createObjectURL(files[i]);
        gallery.appendChild(video);
    }
}

let cakeInterval;

function createCake() {
    const cakes = ["🎂", "🧁", "🍰"];

    const cake = document.createElement("div");
    cake.className = "cake-fall";
    cake.textContent =
        cakes[Math.floor(Math.random() * cakes.length)];

    cake.style.left = Math.random() * 100 + "vw";

    // random pastel colors
    const colors = [
        "#ff69b4",
        "#ffb347",
        "#87cefa",
        "#98fb98",
        "#dda0dd",
        "#ffd700"
    ];

    cake.style.color =
        colors[Math.floor(Math.random() * colors.length)];

    cake.style.fontSize =
        (18 + Math.random() * 12) + "px";

    const duration = 5 + Math.random() * 4;

    cake.style.animation =
        `fallCake ${duration}s linear forwards`;

    document.body.appendChild(cake);

    setTimeout(() => cake.remove(), duration * 1000);
}

function startCakeRain() {

    clearInterval(cakeInterval);

    cakeInterval = setInterval(createCake, 150);

}

function stopCakeRain() {
    clearInterval(cakeInterval);
}

function randomColor(){

    const colors=[
    "#ff4081",
    "#2196f3",
    "#4caf50",
    "#ff9800",
    "#ffeb3b",
    "#9c27b0"
    ];

    return colors[
    Math.floor(
    Math.random()*
    colors.length
    )
    ];
}
function createCandles(age) {

    const container =
        document.getElementById("candles");

    if (!container) return;

    container.innerHTML = "";

    const candleCount = Math.min(age, 30);

    for(let i = 0; i < candleCount; i++) {

        const candle =
            document.createElement("div");

        candle.className = "candle";

        const flame =
            document.createElement("div");

        flame.className = "flame";

        candle.appendChild(flame);

        candle.style.left =
            ((i + 1) * 100 / (candleCount + 1)) + "%";

        container.appendChild(candle);
    }
}
function blowCandles() {

    document
        .querySelectorAll(".flame")
        .forEach(flame => {

            flame.style.transition =
                "all 0.8s ease";

            flame.style.opacity = "0";
            flame.style.transform =
                "translateX(-50%) scale(0)";
        });

    launchConfetti();

    setTimeout(() => {

    const msg =
        document.createElement("div");

    msg.innerHTML =
        "🌟 Make A Wish! 🌟";

    msg.style.position = "fixed";
    msg.style.top = "50%";
    msg.style.left = "50%";
    msg.style.transform =
        "translate(-50%,-50%)";

    msg.style.fontSize = "3rem";
    msg.style.color = "white";
    msg.style.zIndex = "11000";

    document.body.appendChild(msg);

    setTimeout(() => {
        msg.remove();
    }, 2500);

}, 800);
}
function pauseCelebration() {

    isPaused = true;

    clearInterval(slideshowTimer);

    stopCakeRain();

    // Pause music
    const player =
        document.getElementById("audioPlayer");

    player.pause();

    // Pause speech
    speechSynthesis.pause();

    // Pause all falling cakes
    document.querySelectorAll(".cake-fall").forEach(cake => {
        cake.style.animationPlayState = "paused";
    });
}
function stopCelebration() {

    isPaused = false;

    stopCakeRain();

    document.querySelectorAll(".cake-fall").forEach(cake => {
        cake.remove();
    });

    clearInterval(slideshowTimer);

    document.getElementById("candles").innerHTML = "";

    const player =
        document.getElementById("audioPlayer");

    player.pause();
    player.currentTime = 0;

    speechSynthesis.cancel();
}

function clearAll() {

document.querySelectorAll(".confetti")
.forEach(piece => piece.remove());
    const answer = confirm(
        "🗑️ Are you sure you want to clear everything and start a new celebration?"
    );

    if (!answer) {
        return;
    }

    stopCelebration();

document.querySelectorAll(".confetti")
.forEach(piece => piece.remove());
    document.getElementById("nameInput").value = "";
    document.getElementById("ageInput").value = "";
    document.getElementById("birthdayText").value = "";

    document.getElementById("customSongUrl").value = "";

    document.getElementById("heroInput").value = "";
    document.getElementById("photoInput").value = "";
    document.getElementById("videoInput").value = "";
    document.getElementById("musicInput").value = "";
    document.getElementById("cameraInput").value = "";

    document.getElementById("songSelect").selectedIndex = 0;

    const hero =
        document.getElementById("heroImage");

    hero.src = "";
    hero.style.display = "none";

    photos = [];
    currentPhoto = 0;

    document.getElementById(
        "slideImage"
    ).src = "";

    document.getElementById(
        "videoGallery"
    ).innerHTML = "";

    document.getElementById(
        "cakeMessage"
    ).innerHTML =
        "Your birthday message appears here.";

    document.getElementById(
        "candles"
    ).innerHTML = "";

    const player =
        document.getElementById("audioPlayer");

    player.pause();
    player.src = "";

    document.getElementById(
        "customMusicArea"
    ).style.display = "none";

    alert("✅ Ready for a new celebration!");
}
function saveCelebration(){

    const data = {
        name: document.getElementById("nameInput").value,
        age: document.getElementById("ageInput").value,
        message: document.getElementById("birthdayText").value,
        songUrl: document.getElementById("customSongUrl").value
    };

    const blob = new Blob(
        [JSON.stringify(data, null, 2)],
        {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "birthday-save.json";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}

function loadCelebration(){

    const data = JSON.parse(
        localStorage.getItem("birthdayCelebration")
    );

    if(!data){
        alert("No saved celebration found.");
        return;
    }

    document.getElementById("nameInput").value =
        data.name || "";

    document.getElementById("ageInput").value =
        data.age || "";

    document.getElementById("birthdayText").value =
        data.message || "";

    document.getElementById("customSongUrl").value =
        data.songUrl || "";

    alert("📂 Celebration Loaded!");
}

function exportCelebration(){

    const data = {
        name: document.getElementById("nameInput").value,
        age: document.getElementById("ageInput").value,
        message: document.getElementById("birthdayText").value
    };

    const blob = new Blob(
        [JSON.stringify(data, null, 2)],
        {
            type: "application/json"
        }
    );

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "birthday-party.json";

    link.click();
}

function savePicture(){

    html2canvas(document.body,{
        backgroundColor:null,
        scale:2
    }).then(canvas => {

        const image =
            canvas.toDataURL("image/png");

        const win = window.open();

        win.document.write(
            '' +
            image +
            ''
        );
    });
}

</script>

<button onclick="saveCelebration()">
    💾 Save Celebration
</button>

<button onclick="loadCelebration()">
    📂 Load Celebration
</button>

<button onclick="exportCelebration()">
    📥 Export Party
</button>

<button onclick="savePicture()">
    📸 Save Memory
</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
